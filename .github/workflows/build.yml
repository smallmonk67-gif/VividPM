name: Multi-Platform Release Build

# This workflow builds release binaries for macOS (Intel & Apple Silicon),
# Linux (ARM64), and Windows (ARM64) natively on GitHub-hosted runners.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            app_name: VividPM_macOS_arm64_v2.1.0
            artifact_name: VividPM_macOS_arm64_v2.1.0.zip
            delimiter: ":"
            type: macos
          - platform: macos-x86_64
            os: macos-15-intel
            app_name: VividPM_macOS_x86_64_v2.1.0
            artifact_name: VividPM_macOS_x86_64_v2.1.0.zip
            delimiter: ":"
            type: macos
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            app_name: VividPM_Linux_arm64_v2.1.0
            artifact_name: VividPM_Linux_arm64_v2.1.0
            delimiter: ":"
            type: linux
          - platform: linux-x86_64
            os: ubuntu-latest
            app_name: VividPM_Linux_x86_64_v2.1.0
            artifact_name: VividPM_Linux_x86_64_v2.1.0
            delimiter: ":"
            type: linux
          - platform: windows-arm64
            os: windows-11-arm
            app_name: VividPM_Windows_arm64_v2.1.0
            artifact_name: VividPM_Windows_arm64_v2.1.0.exe
            delimiter: ";"
            type: windows
          - platform: windows-x86_64
            os: windows-latest
            app_name: VividPM_Windows_x86_64_v2.1.0
            artifact_name: VividPM_Windows_x86_64_v2.1.0.exe
            delimiter: ";"
            type: windows

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter Pillow darkdetect requests

    - name: Build macOS Application
      if: matrix.type == 'macos'
      run: |
        CTK_PATH=$(python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__).replace('\\\\', '/'))")
        pyinstaller --noconfirm --onedir --windowed \
          --icon "icon.png" \
          --name "VividPM" \
          --add-data "${CTK_PATH}${{ matrix.delimiter }}customtkinter/" \
          --add-data "icon.png${{ matrix.delimiter }}." \
          --add-data "vivid_gui${{ matrix.delimiter }}vivid_gui" \
          "entry_point.py"
        cd dist
        zip -r "../${{ matrix.artifact_name }}" "VividPM.app"

    - name: Build Linux Binary
      if: matrix.type == 'linux'
      run: |
        CTK_PATH=$(python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__).replace('\\\\', '/'))")
        pyinstaller --noconfirm --onefile --windowed \
          --icon "icon.png" \
          --name "${{ matrix.app_name }}" \
          --add-data "${CTK_PATH}${{ matrix.delimiter }}customtkinter/" \
          --add-data "icon.png${{ matrix.delimiter }}." \
          --add-data "vivid_gui${{ matrix.delimiter }}vivid_gui" \
          "entry_point.py"

    - name: Build Windows Binary
      if: matrix.type == 'windows'
      shell: bash
      run: |
        CTK_PATH=$(python -c "import customtkinter, os; print(os.path.dirname(customtkinter.__file__).replace('\\\\', '/'))")
        pyinstaller --noconfirm --onefile --windowed \
          --icon "icon.ico" \
          --name "${{ matrix.app_name }}" \
          --add-data "${CTK_PATH}${{ matrix.delimiter }}customtkinter/" \
          --add-data "icon.png${{ matrix.delimiter }}." \
          --add-data "vivid_gui${{ matrix.delimiter }}vivid_gui" \
          "entry_point.py"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VividPM-${{ matrix.platform }}
        path: |
          ${{ matrix.artifact_name }}
          dist/${{ matrix.artifact_name }}
        if-no-files-found: ignore
