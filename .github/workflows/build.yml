name: Build VividPM Executables

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual triggering

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: VividPM_Windows_2.0.0.exe
            asset_name: VividPM_Windows_2.0.0.exe
          - os: macos-latest
            artifact_name: VividPM_macOS_2.0.0.app
            asset_name: VividPM_macOS_2.0.0.zip # macOS apps are bundles, zip is better for uploading

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use a stable Python version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "icon.ico" --name "VividPM_Windows_2.0.0" --add-data "icon.png;." --add-data "icon.ico;." "launcher.py"
          # PyInstaller outputs to dist/VividPM_Windows_2.0.0
          # Rename the executable for clarity
          Move-Item "dist\VividPM_Windows_2.0.0\VividPM_Windows_2.0.0.exe" "dist\VividPM_Windows_2.0.0.exe"

      - name: Build macOS Executable
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon "icon.ico" --name "VividPM_macOS_2.0.0" --add-data "icon.png:." --add-data "icon.ico:." "launcher.py"
          # Compress the .app bundle
          cd dist
          zip -r VividPM_macOS_2.0.0.zip VividPM_macOS_2.0.0.app

      - name: Upload Artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VividPM-Windows
          path: dist/VividPM_Windows_2.0.0.exe

      - name: Upload Artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: VividPM-macOS
          path: dist/VividPM_macOS_2.0.0.zip
